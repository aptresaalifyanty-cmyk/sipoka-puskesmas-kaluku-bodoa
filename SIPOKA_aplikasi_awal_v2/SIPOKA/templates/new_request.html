{% extends "base.html" %}{% block content %}<h1>Buat Permintaan Obat/BMHP</h1><form method="post" class="card"><label>Unit pelayanan</label>{% if session.unit_name %}<input value="{{session.unit_name}}" disabled>{% else %}<select name="unit_name" required><option value="">Pilih unit pelayanan</option>{% for u in units %}<option>{{u}}</option>{% endfor %}</select>{% endif %}
<label>Daftar barang dan jumlah</label><div id="lines">{% for i in range(4) %}<div class="request-line"><select name="item_id"><option value="">Pilih obat/BMHP</option>{% for x in items %}<option value="{{x.id}}">{{x.name}} (stok {{x.stock:g}} {{x.unit}})</option>{% endfor %}</select><input name="qty" type="number" min="0" step="0.01" placeholder="Jumlah"></div>{% endfor %}</div>
<button type="button" class="secondary" onclick="addLine()">+ Tambah baris</button><label>Keterangan</label><textarea name="note" placeholder="Keterangan kebutuhan (opsional)"></textarea><button>Kirim permintaan</button></form>
<script>function addLine(){let d=document.createElement('div');d.className='request-line';d.innerHTML=document.querySelector('.request-line').innerHTML;document.getElementById('lines').appendChild(d)}</script>{% endblock %}
