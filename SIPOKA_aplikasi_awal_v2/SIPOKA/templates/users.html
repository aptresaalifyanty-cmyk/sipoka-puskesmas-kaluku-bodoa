{% extends "base.html" %}{% block content %}<h1>Manajemen Pengguna</h1><div class="card"><h2>Buat akun baru</h2><form method="post" class="grid"><input name="username" placeholder="Username" required><input name="full_name" placeholder="Nama lengkap" required>
<select name="role"><option value="unit">Petugas Unit</option><option value="farmasi">Petugas Farmasi</option><option value="pimpinan">Kepala Puskesmas</option><option value="admin">Admin</option></select><select name="unit_name"><option value="">Pilih unit (untuk akun unit)</option>{% for u in units %}<option>{{u}}</option>{% endfor %}</select><input name="pin" type="password" inputmode="numeric" minlength="6" placeholder="PIN minimal 6 angka" required><button>Buat akun</button></form></div>
<div class="card table-wrap"><table><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Unit</th><th>Status</th><th>Aksi</th></tr>{% for u in rows %}<tr><td>{{u.username}}</td><td>{{u.full_name}}</td><td>{{u.role}}</td><td>{{u.unit_name or '-'}}</td><td>{{'Aktif' if u.active else 'Nonaktif'}}</td><td><form method="post" action="{{url_for('toggle_user',uid=u.id)}}"><button class="small secondary">{{'Nonaktifkan' if u.active else 'Aktifkan'}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
